mcfm_version = 10.3
writerefs = .true.

# gg -> ZH at LO (loop-induced, MCFM gg_zh: top and bottom loops) as an independent
# cross-check of POWHEG-BOX-V2 ggxy_ggZH and the ggxy fixed-order program.  nproc 110 = Z(-> e- e+) H(-> tau tau);
# extra%only_ggzh (mcfm-10.3.1-only-ggzh.patch) makes the LO ZH matrix element return only gg -> ZH;
# removebr divides by BR(Z->ee) x BR(H->tautau): multiply by 3 x brzee (printed) to get
# Z -> l+ l- (l = e, mu, tau) in the m34 window.  Inputs as in the ggxy_ggZH gridpack card:
# G_mu scheme (MCFM's default G_F, mW, mZ), mt = 172.5 GeV on-shell, mu_R = mu_F = m(ZH)/2.
[general]
    nproc = 110
    part = lo
    runstring = ggzh_lo_stable_nnpdf31
    rundir = ./runs/ggzh_lo_stable_nnpdf31
    sqrts = 13600.0
    ih1 = +1
    ih2 = +1
    zerowidth = .true.
    removebr = .true.
    ewcorr = none
    ewscheme = 1

[lhapdf]
    lhapdfset = NNPDF31_nnlo_as_0118_mc_hessian_pdfas
    lhapdfmember = 0
    dopdferrors = .false.

[scales]
    renscale = 0.5
    facscale = 0.5
    dynamicscale = m(3456)
    doscalevar = .true.
    maxscalevar = 6
    vetoscalevar = .false.

[masses]
    hmass = 125.0
    zmass = 91.1876
    zwidth = 2.4955
    wmass = 80.385
    mt = 172.5
    mb = 4.75

[basicjets]
    inclusive = .true.
    algorithm = ankt
    ptjetmin = 0.0
    etajetmax = 99.0
    Rcutjet = 0.4
    userap = .true.

[masscuts]
    m34min = 0.0
    m56min = 0.0

[cuts]
    makecuts = .false.

[histogram]
    writetop = .false.
    writetxt = .true.
    newstyle = .true.

[integration]
    usesobol = .false.
    seed = 4103
    precisiongoal = 0.0005
    readin = .false.
    writeintermediate = .false.
    warmupprecisiongoal = 0.25
    warmupchisqgoal = 2.5

[extra]
    nohistograms = .false.
    only_ggzh = .true.
